<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthTrack - Cadastro de Assistido</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Cadastro de Assistido</h2>
        <form id="formAssistido">
            <div class="form-group">
                <label>Nome do Assistido</label>
                <input type="text" id="assNome" required>
            </div>
            <div class="form-group">
                <label>Peso (kg)</label>
                <input type="number" step="0.1" id="assPeso" required>
            </div>
            <div class="form-group">
                <label>Data de Nascimento</label>
                <input type="date" id="assData" required>
            </div>
            <button type="submit" id="btnAssistido" class="btn">Salvar Assistido</button>
        </form>
        <div id="msgAssistido" class="mensagem"></div>
        <a href="index.html">Voltar ao Início</a>
    </div>
    <script src="app.js"></script>
</body>
</html>
