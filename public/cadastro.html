<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthTrack - Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Cadastro de Usuário</h2>
        <form id="formCadastro">
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="cadEmail" required>
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="cadSenha" required>
            </div>
            <div class="form-group">
                <label>Data de Nascimento</label>
                <input type="date" id="cadData" required>
            </div>
            <button type="submit" id="btnCadastrar" class="btn">Cadastrar</button>
        </form>
        <div id="msgCadastro" class="mensagem"></div>
        <a href="index.html">Voltar ao Início</a>
    </div>
    <script src="app.js"></script>
</body>
</html>
