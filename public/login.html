<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthTrack - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Login</h2>
        <form id="formLogin">
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="logEmail" required>
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="logSenha" required>
            </div>
            <button type="submit" id="btnLogin" class="btn">Entrar</button>
        </form>
        <div id="msgLogin" class="mensagem"></div>
        <a href="index.html">Voltar ao Início</a>
    </div>
    <script src="app.js"></script>
</body>
</html>
